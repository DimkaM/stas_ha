; PlatformIO project for "stas_ha"
; ESP32-C3 + ADS1115 + 0.5-4.5V pressure sensor (0-1.2 MPa) via voltage divider.
; Integrates with Home Assistant through MQTT auto-discovery.

[platformio]
default_envs = esp32c3
src_dir = src
include_dir = include

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; The board exposes a USB-UART bridge (CH343, 1a86:55d3) -> /dev/ttyACM0 on Linux.
upload_port = /dev/ttyACM0
upload_speed = 921600
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0